databases:
  - name: app-database
    plan: free
    databaseName: company_platform
    user: company_platform_user

services:
  - type: web
    name: app-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: app-database
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://app-frontend.onrender.com
      - key: FRONTEND_BASE_URL
        value: https://app-frontend.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: TELEGRAM_CHANNEL_USERNAME
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_USER_PHONE
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: app-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_AUTH_MODE
        value: backend
      - key: VITE_API_BASE_URL
        value: https://app-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
