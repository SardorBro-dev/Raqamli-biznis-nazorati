databases:
  - name: app-database
    plan: free
    databaseName: company_platform
    user: company_platform

services:
  - type: web
    name: app-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: app-database
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_BASE_URL
        value: https://app-frontend.onrender.com
      - key: CORS_ORIGINS
        value: https://app-frontend.onrender.com
      - key: API_V1_PREFIX
        value: /api/v1
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_CHANNEL_USERNAME
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: app-frontend
    env: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_AUTH_MODE
        value: backend
      - key: VITE_API_BASE_URL
        value: https://app-backend.onrender.com/api/v1services:
  - type: web
    name: app-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./data/company_platform.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_BASE_URL
        value: https://your-frontend-domain.onrender.com
      - key: CORS_ORIGINS
        value: https://your-frontend-domain.onrender.com
      - key: API_V1_PREFIX
        value: /api/v1
      - key: TELEGRAM_BOT_TOKEN
        value: ""
      - key: TELEGRAM_API_ID
        value: "0"
      - key: TELEGRAM_API_HASH
        value: ""
      - key: TELEGRAM_CHANNEL_USERNAME
        value: "@your_channel_username"
      - key: TELEGRAM_CHANNEL_ID
        value: ""

  - type: static
    name: app-frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_AUTH_MODE
        value: backend
      - key: VITE_API_BASE_URL
        value: https://your-backend-domain.onrender.com/api/v1
