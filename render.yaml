databases:
  - name: app-database
    plan: free
    databaseName: company_platform
    user: company_platform

services:
  - type: web
    name: app-web
    env: python
    plan: free
    rootDir: kompaniya-nazorati-new
    buildCommand: npm install && npm run build && pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: app-database
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_BASE_URL
        value: https://app-web.onrender.com
      - key: CORS_ORIGINS
        value: https://app-web.onrender.com
      - key: API_V1_PREFIX
        value: /api/v1
      - key: VITE_AUTH_MODE
        value: backend
      - key: VITE_API_BASE_URL
        value: /api/v1
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_CHANNEL_USERNAME
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
