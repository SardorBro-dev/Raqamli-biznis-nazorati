services:
  - type: web
    name: app-frontend
    env: static
    rootDir: kompaniya-nazorati-new
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_AUTH_MODE
        value: backend
      - key: VITE_API_BASE_URL
        value: https://app-backend-pure.onrender.com/api/v1
